<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f2ee">
<title>SSSkeratin — кератиновое выпрямление и реконструкция волос</title>
<style>
:root{
  --bg:#f8f4f0; --paper:#fffdfa; --ink:#272321; --muted:#81766e;
  --line:#e7ded7; --accent:#b28d79; --accent2:#8e6c5a;
}
*{box-sizing:border-box} html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
a{color:inherit;text-decoration:none}
.container{width:min(1120px,92%);margin:auto}
header{position:sticky;top:0;z-index:20;background:rgba(248,244,240,.9);backdrop-filter:blur(14px);border-bottom:1px solid rgba(231,222,215,.8)}
.nav{height:68px;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:22px;letter-spacing:3px;font-weight:700}
.navlinks{display:flex;gap:22px;font-size:13px;color:var(--muted)}
.hero{padding:76px 0 50px}
.hero-grid{display:grid;grid-template-columns:1fr 1.1fr;gap:42px;align-items:center}
.eyebrow{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--accent2);margin-bottom:18px}
h1{font-family:Georgia,serif;font-size:clamp(46px,7vw,82px);line-height:.92;font-weight:400;margin:0 0 24px}
.hero p{font-size:17px;line-height:1.65;color:var(--muted);max-width:500px}
.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--ink);padding:14px 20px;border-radius:999px;font-size:13px;margin:8px 8px 0 0;transition:.2s}
.btn.primary{background:var(--ink);color:#fff}
.btn:hover{transform:translateY(-2px)}
.hero-photo{height:620px;border-radius:28px;overflow:hidden}
.hero-photo img{width:100%;height:100%;object-fit:cover;object-position:center}
section{padding:72px 0}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:30px}
h2{font-family:Georgia,serif;font-size:42px;font-weight:400;margin:0}
.section-head p{color:var(--muted);max-width:440px;line-height:1.55}
.services{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:26px}
.card h3{font-family:Georgia,serif;font-size:25px;font-weight:400;margin:0 0 10px}
.card p{color:var(--muted);line-height:1.5;font-size:14px}
.price-list{margin-top:18px;border-top:1px solid var(--line)}
.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.row span:last-child{font-weight:700}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.photo{border-radius:20px;overflow:hidden;background:#eee;aspect-ratio:4/5;cursor:pointer}
.photo:nth-child(2),.photo:nth-child(5),.photo:nth-child(8){aspect-ratio:1/1}
.photo img{width:100%;height:100%;object-fit:cover;transition:.35s}
.photo:hover img{transform:scale(1.03)}
.info{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.info .card{min-height:190px}
.booking{background:var(--ink);color:white;border-radius:30px;padding:45px}
.booking h2{color:white}
.booking p{color:#cfc5bf}
form{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:24px}
input,select{width:100%;padding:15px;border-radius:12px;border:1px solid #4b4541;background:#302c29;color:white;font:inherit}
.full{grid-column:1/-1}
.booking .btn{border-color:white;color:white}
.booking .btn.primary{background:white;color:var(--ink)}
.contacts{display:flex;flex-wrap:wrap;gap:12px;margin-top:20px}
.contact{padding:16px 20px;background:var(--paper);border:1px solid var(--line);border-radius:16px}
footer{padding:30px 0 50px;color:var(--muted);font-size:12px}
.note{font-size:12px;color:var(--muted);line-height:1.5;margin-top:15px}
@media(max-width:800px){
 .navlinks{display:none}.hero{padding-top:38px}.hero-grid,.info{grid-template-columns:1fr}
 .hero-photo{height:500px}.services{grid-template-columns:1fr}.gallery{grid-template-columns:1fr 1fr}
 h2{font-size:34px}.section-head{display:block}.section-head p{margin-top:12px}
 form{grid-template-columns:1fr}.full{grid-column:auto}.booking{padding:28px}
}

.admin-grid{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:center}
.slot-day{background:#302c29;border:1px solid #4b4541;border-radius:16px;padding:16px;margin-bottom:10px}
.slot-day-title{font-weight:700;margin-bottom:10px}
.slot-list{display:flex;flex-wrap:wrap;gap:8px}
.slot{padding:9px 12px;border-radius:999px;border:1px solid #6a5f58;background:#3a3430;color:#fff;cursor:pointer}
.slot.busy{opacity:.35;text-decoration:line-through;cursor:not-allowed}
.slot.selected{background:#fff;color:#272321;border-color:#fff}
.client-day{background:#fffdfa;color:#272321;border:1px solid #e7ded7;border-radius:16px;padding:14px;margin:10px 0}
.client-day strong{display:block;margin-bottom:9px}
.client-times{display:flex;flex-wrap:wrap;gap:8px}
.client-time{padding:10px 13px;border-radius:999px;border:1px solid #d9cec5;background:#f8f4f0;cursor:pointer}
.client-time:hover,.client-time.active{background:#272321;color:#fff;border-color:#272321}
.confirm{padding:16px;border-radius:14px;background:#3a3430;color:#fff}
@media(max-width:700px){.admin-grid{grid-template-columns:1fr}.client-time{flex:1;text-align:center}}

</head>
<body>
<header>
 <div class="container nav">
  <div class="logo">SSSkeratin</div>
  <nav class="navlinks">
   <a href="#services">Услуги</a><a href="#works">Работы</a><a href="#prices">Цены</a><a href="#booking">Запись</a>
  </nav>
  <a class="btn primary" href="#booking" style="margin:0;padding:10px 15px">Записаться</a>
 </div>
</header>

<main>
<section class="hero">
 <div class="container hero-grid">
  <div>
   <div class="eyebrow">Hair reconstruction • SSSkeratin</div>
   <h1>Гладкие.<br>Блестящие.<br>Твои.</h1>
   <p>Кератиновое выпрямление, нанопластика и горячий ботокс. Подбираю процедуру под состояние и особенности именно твоих волос.</p>
   <a class="btn primary" href="#booking">Записаться</a>
   <a class="btn" href="#works">Смотреть работы</a>
  </div>
  <div class="hero-photo"><img src="images/work-1.jpeg" alt="Работа SSSkeratin"></div>
 </div>
</section>

<section id="services">
 <div class="container">
  <div class="section-head"><h2>Услуги</h2><p>Стоимость зависит от длины волос. Для очень длинных и густых волос рассчитывается индивидуально.</p></div>
  <div class="services">
   <article class="card"><h3>KERATIN</h3><p>Выпрямление, гладкость и ухоженный вид волос.</p>
    <div class="price-list">
     <div class="row"><span>20 см</span><span>3 000 ₽</span></div><div class="row"><span>30 см</span><span>4 000 ₽</span></div>
     <div class="row"><span>40 см</span><span>5 000 ₽</span></div><div class="row"><span>50 см</span><span>6 000 ₽</span></div>
     <div class="row"><span>60 см</span><span>7 000 ₽</span></div><div class="row"><span>70 см</span><span>8 000 ₽</span></div>
    </div>
   </article>
   <article class="card"><h3>NANOPLASTIKA</h3><p>Глубокое разглаживание и дисциплина волос с акцентом на гладкость.</p>
    <div class="price-list">
     <div class="row"><span>20 см</span><span>3 000 ₽</span></div><div class="row"><span>30 см</span><span>5 000 ₽</span></div>
     <div class="row"><span>40 см</span><span>6 000 ₽</span></div><div class="row"><span>50 см</span><span>7 000 ₽</span></div>
     <div class="row"><span>60 см</span><span>8 000 ₽</span></div><div class="row"><span>70 см</span><span>9 000 ₽</span></div>
    </div>
   </article>
   <article class="card"><h3>BOTOX IN HOT TECHNIQUE</h3><p>Уходовая процедура для более гладкого, плотного и блестящего полотна.</p>
    <div class="price-list">
     <div class="row"><span>20 см</span><span>2 500 ₽</span></div><div class="row"><span>30 см</span><span>3 500 ₽</span></div>
     <div class="row"><span>40 см</span><span>4 500 ₽</span></div><div class="row"><span>50 см</span><span>5 500 ₽</span></div>
     <div class="row"><span>60 см</span><span>6 500 ₽</span></div><div class="row"><span>70 см</span><span>7 000 ₽</span></div>
    </div>
   </article>
  </div>
 </div>
</section>

<section id="works">
 <div class="container">
  <div class="section-head"><h2>Мои работы</h2><p>Результаты процедур SSSkeratin. Нажми на фото, чтобы посмотреть его крупнее.</p></div>
  <div class="gallery">
   <div class="photo"><img src="images/work-1.jpeg" alt="Работа 1"></div>
   <div class="photo"><img src="images/work-2.jpeg" alt="Работа 2"></div>
   <div class="photo"><img src="images/work-3.jpeg" alt="Работа 3"></div>
   <div class="photo"><img src="images/work-4.jpeg" alt="Работа 4"></div>
   <div class="photo"><img src="images/work-5.jpeg" alt="Работа 5"></div>
   <div class="photo"><img src="images/work-6.jpeg" alt="Работа 6"></div>
   <div class="photo"><img src="images/work-7.jpeg" alt="Работа 7"></div>
   <div class="photo"><img src="images/work-8.jpeg" alt="Работа 8"></div>
   <div class="photo"><img src="images/work-9.jpeg" alt="Работа 9"></div>
  </div>
 </div>
</section>

<section id="prices">
 <div class="container">
  <div class="section-head"><h2>Условия</h2></div>
  <div class="info">
   <div class="card"><h3>Доплата</h3><p>Волосы длиной более 70 см — индивидуальный расчёт.<br>При густоте волос более 8 см — доплата от 1 000 до 2 500 ₽.</p></div>
   <div class="card"><h3>Скидки</h3><p>−15% на первое посещение.<br>−10% на следующее посещение при отметке мастера в Stories.</p></div>
  </div>
 </div>
</section>

<section id="booking">
 <div class="container">
  <div class="booking">
   <div id="clientBooking">
    <h2>Онлайн-запись</h2>
    <p>Выберите удобную дату и свободное время. После записи выбранное окно автоматически исчезнет из списка.</p>
    <div id="calendarClient"></div>
    <form id="bookingForm">
     <select id="procedure" required><option value="">Процедура</option><option>KERATIN</option><option>NANOPLASTIKA</option><option>BOTOX IN HOT TECHNIQUE</option></select>
     <select id="length" required><option value="">Длина волос</option><option>20 см</option><option>30 см</option><option>40 см</option><option>50 см</option><option>60 см</option><option>70 см</option><option>Более 70 см</option></select>
     <input id="name" placeholder="Ваше имя" required>
     <input id="contact" placeholder="Telegram / Instagram" required>
     <input id="selectedDate" type="hidden">
     <input id="selectedTime" type="hidden">
     <button class="btn primary full" type="submit">Забронировать выбранное время</button>
    </form>
    <div id="clientResult" style="display:none;margin-top:18px"></div>
   </div>

   <div id="adminPanel" style="display:none">
    <h2>SSSkeratin · Админ</h2>
    <p>Здесь ты сама управляешь свободными окошками. Данные сохраняются в браузере этого устройства.</p>
    <div class="admin-grid">
      <input id="adminDate" type="date">
      <input id="adminTime" type="time">
      <button class="btn primary" id="addSlot">Добавить свободное время</button>
    </div>
    <div class="admin-grid" style="margin-top:12px">
      <input id="adminRemoveDate" type="date">
      <input id="adminRemoveTime" type="time">
      <button class="btn" id="removeSlot">Удалить окно</button>
    </div>
    <div id="adminSlots" style="margin-top:24px"></div>
    <button class="btn" id="closeAdmin" style="margin-top:18px">Закрыть админку</button>
   </div>

   <button class="btn" id="adminOpen" style="margin-top:22px">Для мастера</button>
   <div class="note">Для полноценной синхронизации с календарём iPhone нужен отдельный iOS-компонент: Apple предоставляет доступ к календарю через EventKit только приложениям с разрешением пользователя. Сам обычный сайт в Safari не может напрямую читать твой локальный календарь. Поэтому эта версия уже управляет окнами онлайн, а подключение iCloud-календаря делается отдельным iOS-модулем.</div>
  </div>
 </div>
</section>

<section>
 <div class="container">
  <div class="section-head"><h2>Контакты</h2><p>Выбирай удобный способ связи.</p></div>
  <div class="contacts">
   <a class="contact" href="https://t.me/SSSkeratin" target="_blank">Telegram — личные сообщения</a>
   <a class="contact" href="https://t.me/keratinirir" target="_blank">Telegram — канал</a>
   <a class="contact" href="https://www.instagram.com/ssskeratin" target="_blank">Instagram — @ssskeratin</a>
  </div>
 </div>
</section>
</main>

<footer><div class="container">© SSSkeratin · Hair reconstruction & smooth hair</div></footer>

<script>
const KEY='sss_slots_v1', BOOK='sss_bookings_v1';
const getSlots=()=>JSON.parse(localStorage.getItem(KEY)||'[]');
const saveSlots=x=>localStorage.setItem(KEY,JSON.stringify(x.sort()));
const getBookings=()=>JSON.parse(localStorage.getItem(BOOK)||'[]');
const saveBookings=x=>localStorage.setItem(BOOK,JSON.stringify(x));

function fmt(d){return new Date(d+'T00:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'long',weekday:'long'});}
function renderClient(){
 const box=document.getElementById('calendarClient'), slots=getSlots(), bookings=getBookings();
 if(!slots.length){box.innerHTML='<div class="confirm">Свободных окон пока нет. Следите за обновлением расписания.</div>';return;}
 const grouped={}; slots.forEach(s=>(grouped[s.date]??=[]).push(s.time));
 box.innerHTML=Object.keys(grouped).sort().map(d=>{
   const times=grouped[d].sort();
   return `<div class="client-day"><strong>${fmt(d)}</strong><div class="client-times">`+
   times.map(t=>{
     const busy=bookings.some(b=>b.date===d&&b.time===t);
     return `<button type="button" class="client-time ${busy?'busy':''}" ${busy?'disabled':''} data-date="${d}" data-time="${t}">${t}${busy?' · занято':''}</button>`;
   }).join('')+'</div></div>';
 }).join('');
 document.querySelectorAll('.client-time:not(.busy)').forEach(btn=>btn.onclick=()=>{
   document.querySelectorAll('.client-time').forEach(x=>x.classList.remove('active'));
   btn.classList.add('active');
   document.getElementById('selectedDate').value=btn.dataset.date;
   document.getElementById('selectedTime').value=btn.dataset.time;
 });
}
function renderAdmin(){
 const box=document.getElementById('adminSlots'), slots=getSlots(), bookings=getBookings();
 if(!slots.length){box.innerHTML='<div class="confirm">Окон пока нет.</div>';return;}
 const grouped={}; slots.forEach(s=>(grouped[s.date]??=[]).push(s.time));
 box.innerHTML=Object.keys(grouped).sort().map(d=>{
  const times=grouped[d].sort();
  return `<div class="slot-day"><div class="slot-day-title">${fmt(d)}</div><div class="slot-list">`+
   times.map(t=>{
    const busy=bookings.some(b=>b.date===d&&b.time===t);
    return `<span class="slot ${busy?'busy':''}">${t}${busy?' · занято':''}</span>`;
   }).join('')+'</div></div>';
 }).join('');
}
document.getElementById('addSlot').onclick=()=>{
 const d=document.getElementById('adminDate').value,t=document.getElementById('adminTime').value;
 if(!d||!t)return alert('Выбери дату и время.');
 const slots=getSlots(); if(!slots.some(s=>s.date===d&&s.time===t)) slots.push({date:d,time:t});
 saveSlots(slots);renderAdmin();renderClient();
};
document.getElementById('removeSlot').onclick=()=>{
 const d=document.getElementById('adminRemoveDate').value,t=document.getElementById('adminRemoveTime').value;
 saveSlots(getSlots().filter(s=>!(s.date===d&&s.time===t)));renderAdmin();renderClient();
};
document.getElementById('adminOpen').onclick=()=>{
 const pass=prompt('Пароль мастера:');
 if(pass==='SSS2026'){document.getElementById('clientBooking').style.display='none';document.getElementById('adminPanel').style.display='block';document.getElementById('adminOpen').style.display='none';renderAdmin();}
 else if(pass!==null) alert('Неверный пароль.');
};
document.getElementById('closeAdmin').onclick=()=>{
 document.getElementById('adminPanel').style.display='none';document.getElementById('clientBooking').style.display='block';document.getElementById('adminOpen').style.display='inline-flex';renderClient();
};
document.getElementById('bookingForm').onsubmit=e=>{
 e.preventDefault();
 const d=document.getElementById('selectedDate').value,t=document.getElementById('selectedTime').value;
 if(!d||!t)return alert('Сначала выбери свободное время.');
 const bookings=getBookings();
 if(bookings.some(b=>b.date===d&&b.time===t))return alert('Это время уже занято.');
 const b={date:d,time:t,procedure:document.getElementById('procedure').value,length:document.getElementById('length').value,name:document.getElementById('name').value,contact:document.getElementById('contact').value};
 bookings.push(b);saveBookings(bookings);
 document.getElementById('clientResult').style.display='block';
 document.getElementById('clientResult').innerHTML=`<div class="confirm"><b>Заявка создана ✓</b><br><br>${fmt(d)} в ${t}<br>${b.procedure}, ${b.length}<br><br>Для окончательного подтверждения напиши мне в Telegram или Instagram.</div>`;
 renderClient();
};


renderClient();
</script>
</body>
</html>
